<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>KORA — Enregistreur de démonstration réelle</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050806; }
    body { display: grid; place-items: center; }
    canvas { width: 1280px; height: 720px; }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>
  <script>
    const canvas = document.querySelector("#stage");
    const ctx = canvas.getContext("2d", { alpha: false });
    const width = canvas.width;
    const height = canvas.height;
    const logo = new Image();
    const safinumLogo = new Image();
    logo.src = "../../src/icons/icon-128.png";
    safinumLogo.src = "assets/logo-safinum.png";

    const noise = document.createElement("canvas");
    noise.width = 320;
    noise.height = 180;
    const noiseContext = noise.getContext("2d");
    const noiseData = noiseContext.createImageData(noise.width, noise.height);
    for (let index = 0; index < noiseData.data.length; index += 4) {
      const value = Math.random() * 255;
      noiseData.data[index] = value;
      noiseData.data[index + 1] = value;
      noiseData.data[index + 2] = value;
      noiseData.data[index + 3] = Math.random() * 18;
    }
    noiseContext.putImageData(noiseData, 0, 0);

    const state = {
      mode: "intro",
      title: "KORA",
      chapter: "La finance numérique en foufouldé",
      caption: "Comprendre, vérifier et confirmer dans sa langue",
      frame: null,
      sourceWidth: 1440,
      sourceHeight: 900,
      popupFrame: null,
      popupVisible: false,
      installPathVisible: false,
      cursor: { x: width / 2, y: height / 2, visible: false },
      click: { startedAt: 0 },
      transitionStartedAt: performance.now(),
      sceneIndex: 0,
      sceneCount: 8,
      audio: null,
      audioEnded: true,
      audioContext: null,
      audioDestination: null,
      musicGain: null,
      musicOscillators: [],
      musicTimer: null,
      pulseTimer: null,
      master: null,
      recorder: null,
      chunks: []
    };

    function roundRect(x, y, w, h, radius) {
      const r = Math.min(radius, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrap(text, x, y, maxWidth, lineHeight, maxLines = 4) {
      const words = text.split(/\s+/u);
      let line = "";
      let row = 0;
      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (ctx.measureText(candidate).width > maxWidth && line) {
          ctx.fillText(line, x, y + row * lineHeight);
          line = word;
          row += 1;
          if (row >= maxLines - 1) break;
        } else {
          line = candidate;
        }
      }
      if (row < maxLines) ctx.fillText(line, x, y + row * lineHeight);
      return y + (row + 1) * lineHeight;
    }

    function drawBackdrop() {
      ctx.fillStyle = "#050806";
      ctx.fillRect(0, 0, width, height);
      const glow = ctx.createRadialGradient(1100, 80, 20, 1100, 80, 720);
      glow.addColorStop(0, "rgba(16, 163, 127, .24)");
      glow.addColorStop(0.48, "rgba(15, 63, 50, .08)");
      glow.addColorStop(1, "rgba(5, 8, 6, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
      ctx.globalAlpha = 0.12;
      ctx.drawImage(noise, 0, 0, width, height);
      ctx.globalAlpha = 1;
    }

    function drawBrand() {
      drawBackdrop();
      const elapsed = performance.now() - state.transitionStartedAt;
      const reveal = Math.min(1, elapsed / 520);
      const eased = 1 - Math.pow(1 - reveal, 3);
      ctx.save();
      ctx.globalAlpha = eased;
      ctx.translate((1 - eased) * 36, 0);

      if (state.mode === "outro") {
        ctx.drawImage(logo, 74, 72, 92, 92);
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 52px DejaVu Sans, Arial";
        ctx.fillText("KORA", 194, 132);
        ctx.fillStyle = "#7fdcc4";
        ctx.font = "700 18px DejaVu Sans, Arial";
        ctx.fillText("COMPRENDRE · VÉRIFIER · CONFIRMER", 76, 218);
        ctx.fillStyle = "#ffffff";
        ctx.font = "700 30px DejaVu Sans, Arial";
        ctx.fillText("Une finance numérique accessible", 76, 278);
        ctx.fillText("en foufouldé.", 76, 318);

        ctx.fillStyle = "#a7b8b1";
        ctx.font = "400 17px DejaVu Sans, Arial";
        ctx.fillText("Validation linguistique", 76, 402);
        ctx.fillStyle = "#ffffff";
        ctx.font = "700 21px DejaVu Sans, Arial";
        ctx.fillText("Jean-Ernest SOUROUMBAI", 76, 434);
        ctx.fillStyle = "#a7b8b1";
        ctx.font = "400 16px DejaVu Sans, Arial";
        ctx.fillText("AZAB A RANGA FRANCK MIGUEL · BELL AQIL", 76, 515);
        ctx.fillText("SIMO SIGEU NKOUAMKAM MENELIK", 76, 545);
        ctx.fillStyle = "#e9b949";
        ctx.font = "700 16px DejaVu Sans, Arial";
        ctx.fillText("github.com/kaezerwatto/KORA", 76, 625);

        ctx.drawImage(safinumLogo, 914, 116, 250, 250);
        ctx.fillStyle = "#d9e3df";
        ctx.textAlign = "center";
        ctx.font = "700 17px DejaVu Sans, Arial";
        ctx.fillText("SAFINUM INNOVATE CHALLENGE 2026", 1039, 415);
        ctx.fillStyle = "#91a39c";
        ctx.font = "400 15px DejaVu Sans, Arial";
        ctx.fillText("Local · privé · valeurs préservées", 1039, 448);
        ctx.textAlign = "left";
      } else {
        ctx.drawImage(logo, 76, 70, 102, 102);
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 28px DejaVu Sans, Arial";
        ctx.fillText("KORA", 204, 132);
        ctx.drawImage(safinumLogo, 1052, 52, 126, 126);
        ctx.fillStyle = "#e9b949";
        ctx.font = "700 15px DejaVu Sans, Arial";
        ctx.fillText("PITCH-DÉMO RÉEL · SAFINUM 2026", 76, 242);
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 57px DejaVu Sans, Arial";
        const bottom = wrap(state.title, 76, 318, 930, 65, 2);
        ctx.fillStyle = "#a7b8b1";
        ctx.font = "400 24px DejaVu Sans, Arial";
        wrap(state.caption, 78, bottom + 26, 850, 36, 2);

        ctx.strokeStyle = "rgba(126, 220, 196, .28)";
        ctx.beginPath();
        ctx.moveTo(76, 565);
        ctx.lineTo(1180, 565);
        ctx.stroke();
        ctx.font = "700 15px DejaVu Sans, Arial";
        ctx.fillStyle = "#7fdcc4";
        ctx.fillText("100 % LOCAL", 76, 615);
        ctx.fillText("FR / EN → FOUFOULDÉ", 376, 615);
        ctx.fillText("MONTANTS ET IDENTITÉS INTACTS", 760, 615);
      }
      ctx.restore();
    }

    function containRect(sourceWidth, sourceHeight, target = { x: 0, y: 0, width, height }) {
      const scale = Math.min(target.width / sourceWidth, target.height / sourceHeight);
      const drawWidth = sourceWidth * scale;
      const drawHeight = sourceHeight * scale;
      return {
        x: target.x + (target.width - drawWidth) / 2,
        y: target.y + (target.height - drawHeight) / 2,
        width: drawWidth,
        height: drawHeight,
        scale
      };
    }

    function drawCursor() {
      if (!state.cursor.visible || state.popupVisible) return;
      const { x, y } = state.cursor;
      const elapsed = performance.now() - state.click.startedAt;
      if (elapsed < 300) {
        const progress = elapsed / 300;
        ctx.beginPath();
        ctx.arc(x, y, 9 + progress * 20, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(233, 185, 73, ${1 - progress})`;
        ctx.lineWidth = 3 - progress;
        ctx.stroke();
      }
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 24);
      ctx.lineTo(7, 18);
      ctx.lineTo(13, 29);
      ctx.lineTo(19, 26);
      ctx.lineTo(13, 15);
      ctx.lineTo(23, 14);
      ctx.closePath();
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0,0,0,.78)";
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.strokeStyle = "#08100c";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    function drawScreen() {
      ctx.fillStyle = "#050806";
      ctx.fillRect(0, 0, width, height);
      if (state.frame) {
        const rect = containRect(state.sourceWidth, state.sourceHeight);
        ctx.drawImage(state.frame, rect.x, rect.y, rect.width, rect.height);
      }

      if (state.installPathVisible) {
        roundRect(330, 22, 620, 64, 12);
        ctx.fillStyle = "rgba(10, 16, 13, .94)";
        ctx.fill();
        ctx.strokeStyle = "rgba(126, 220, 196, .45)";
        ctx.stroke();
        ctx.fillStyle = "#7fdcc4";
        ctx.font = "700 12px DejaVu Sans, Arial";
        ctx.fillText("CHARGER L’EXTENSION NON EMPAQUETÉE", 354, 48);
        ctx.fillStyle = "#ffffff";
        ctx.font = "600 16px DejaVu Sans Mono, monospace";
        ctx.fillText("release/kora-unpacked", 354, 72);
      }

      if (state.popupVisible && state.popupFrame) {
        const popupWidth = 360;
        const popupHeight = Math.min(520, state.popupFrame.naturalHeight);
        const x = width - popupWidth - 46;
        const y = 64;
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, .72)";
        ctx.shadowBlur = 34;
        ctx.shadowOffsetY = 12;
        roundRect(x - 1, y - 1, popupWidth + 2, popupHeight + 2, 22);
        ctx.fillStyle = "#0d0d0d";
        ctx.fill();
        ctx.restore();
        ctx.save();
        roundRect(x, y, popupWidth, popupHeight, 21);
        ctx.clip();
        ctx.drawImage(
          state.popupFrame,
          0,
          0,
          state.popupFrame.naturalWidth,
          popupHeight,
          x,
          y,
          popupWidth,
          popupHeight
        );
        ctx.restore();
      }
      drawCursor();
    }

    function drawProgress() {
      const local =
        state.audio && Number.isFinite(state.audio.duration) && state.audio.duration > 0
          ? Math.min(
              1,
              (state.audioContext.currentTime - state.audio.startedAt) /
                state.audio.duration
            )
          : 0;
      const overall = (state.sceneIndex + local) / state.sceneCount;
      ctx.fillStyle = "rgba(12, 29, 22, .92)";
      ctx.fillRect(0, height - 5, width, 5);
      ctx.fillStyle = "#27c49c";
      ctx.fillRect(0, height - 5, width * overall, 5);
    }

    function draw() {
      if (state.mode === "screen") drawScreen();
      else drawBrand();
      drawProgress();

      const transition = performance.now() - state.transitionStartedAt;
      if (transition < 360) {
        const progress = transition / 360;
        const alpha = Math.sin(progress * Math.PI) * 0.18;
        const leak = ctx.createLinearGradient(
          width * (progress - 0.28),
          0,
          width * (progress + 0.18),
          height
        );
        leak.addColorStop(0, "rgba(7, 18, 13, 0)");
        leak.addColorStop(0.45, `rgba(36, 207, 163, ${alpha})`);
        leak.addColorStop(0.7, `rgba(233, 185, 73, ${alpha * 0.55})`);
        leak.addColorStop(1, "rgba(7, 18, 13, 0)");
        ctx.fillStyle = leak;
        ctx.fillRect(0, 0, width, height);
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    function setFrame(dataUrl) {
      const image = new Image();
      image.onload = () => {
        state.frame = image;
        state.sourceWidth = image.naturalWidth;
        state.sourceHeight = image.naturalHeight;
      };
      image.src = dataUrl;
    }

    function setPopup(dataUrl) {
      if (!dataUrl) {
        state.popupFrame = null;
        state.popupVisible = false;
        return;
      }
      const image = new Image();
      image.onload = () => {
        state.popupFrame = image;
        state.popupVisible = true;
      };
      image.src = dataUrl;
    }

    window.koraVideo = {
      setScene({ mode, title, chapter, caption, index, count }) {
        state.mode = mode;
        state.title = title ?? state.title;
        state.chapter = chapter ?? state.chapter;
        state.caption = caption ?? "";
        state.sceneIndex = index ?? state.sceneIndex;
        state.sceneCount = count ?? state.sceneCount;
        state.transitionStartedAt = performance.now();
        if (mode !== "screen") {
          state.cursor.visible = false;
          state.popupVisible = false;
          state.installPathVisible = false;
        }
      },
      setFrame,
      setPopup,
      showPopup(visible) {
        state.popupVisible = Boolean(visible) && Boolean(state.popupFrame);
      },
      showInstallPath(visible) {
        state.installPathVisible = Boolean(visible);
      },
      setCursor(cursor) {
        state.cursor = { ...state.cursor, ...cursor };
      },
      click() {
        state.click.startedAt = performance.now();
      },
      async resumeAudio() {
        if (state.audioContext?.state === "suspended") {
          await state.audioContext.resume();
        }
      },
      async startRecording() {
        state.audioContext = new AudioContext();
        state.audioDestination = state.audioContext.createMediaStreamDestination();
        await state.audioContext.resume();

        state.master = state.audioContext.createDynamicsCompressor();
        state.master.threshold.value = -10;
        state.master.knee.value = 14;
        state.master.ratio.value = 3;
        state.master.attack.value = 0.004;
        state.master.release.value = 0.22;
        state.master.connect(state.audioDestination);

        const filter = state.audioContext.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 1100;
        filter.Q.value = 0.7;
        state.musicGain = state.audioContext.createGain();
        state.musicGain.gain.setValueAtTime(0, state.audioContext.currentTime);
        state.musicGain.gain.linearRampToValueAtTime(
          0.058,
          state.audioContext.currentTime + 1.8
        );
        filter.connect(state.musicGain);
        state.musicGain.connect(state.master);

        const chords = [
          [110, 164.81, 220],
          [98, 146.83, 196],
          [130.81, 196, 261.63],
          [87.31, 130.81, 174.61]
        ];
        state.musicOscillators = chords[0].map((frequency, index) => {
          const oscillator = state.audioContext.createOscillator();
          const voiceGain = state.audioContext.createGain();
          oscillator.type = index === 0 ? "sine" : "triangle";
          oscillator.frequency.value = frequency;
          oscillator.detune.value = index === 1 ? -5 : index === 2 ? 4 : 0;
          voiceGain.gain.value = index === 0 ? 0.5 : 0.22;
          oscillator.connect(voiceGain);
          voiceGain.connect(filter);
          oscillator.start();
          return oscillator;
        });
        let chordIndex = 0;
        state.musicTimer = setInterval(() => {
          chordIndex = (chordIndex + 1) % chords.length;
          const now = state.audioContext.currentTime;
          state.musicOscillators.forEach((oscillator, index) => {
            oscillator.frequency.setTargetAtTime(
              chords[chordIndex][index],
              now,
              1.4
            );
          });
        }, 7_200);

        let pulseStep = 0;
        state.pulseTimer = setInterval(() => {
          const now = state.audioContext.currentTime;
          const notes = [440, 392, 523.25, 349.23];
          const oscillator = state.audioContext.createOscillator();
          const pulseGain = state.audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = notes[pulseStep % notes.length];
          pulseGain.gain.setValueAtTime(0, now);
          pulseGain.gain.linearRampToValueAtTime(0.012, now + 0.02);
          pulseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.62);
          oscillator.connect(pulseGain);
          pulseGain.connect(state.master);
          oscillator.start(now);
          oscillator.stop(now + 0.65);
          pulseStep += 1;
        }, 3_600);

        const canvasStream = canvas.captureStream(24);
        const stream = new MediaStream([
          canvasStream.getVideoTracks()[0],
          state.audioDestination.stream.getAudioTracks()[0]
        ]);
        const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
          ? "video/webm;codecs=vp9,opus"
          : "video/webm;codecs=vp8,opus";
        state.chunks = [];
        state.recorder = new MediaRecorder(stream, {
          mimeType,
          videoBitsPerSecond: 470000,
          audioBitsPerSecond: 64000
        });
        state.recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size) state.chunks.push(event.data);
        });
        state.recorder.start(1000);
        return mimeType;
      },
      async startAudio(url, playbackRate = 1) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Narration inaccessible : ${response.status}`);
        const buffer = await state.audioContext.decodeAudioData(await response.arrayBuffer());
        const source = state.audioContext.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.value = playbackRate;
        source.connect(state.master);
        const duration = buffer.duration / playbackRate;
        state.audio = {
          source,
          duration,
          startedAt: state.audioContext.currentTime
        };
        state.audioEnded = false;
        source.addEventListener("ended", () => {
          state.audioEnded = true;
        }, { once: true });
        source.start();
        return duration;
      },
      audioStatus() {
        const currentTime = state.audio
          ? Math.min(
              state.audio.duration,
              state.audioContext.currentTime - state.audio.startedAt
            )
          : 0;
        return {
          ended: state.audioEnded,
          currentTime,
          duration: state.audio?.duration ?? 0
        };
      },
      async stopRecording() {
        clearInterval(state.musicTimer);
        clearInterval(state.pulseTimer);
        const fadeStarted = state.audioContext.currentTime;
        state.musicGain.gain.cancelScheduledValues(fadeStarted);
        state.musicGain.gain.setValueAtTime(state.musicGain.gain.value, fadeStarted);
        state.musicGain.gain.linearRampToValueAtTime(0, fadeStarted + 1.1);
        await new Promise((resolve) => setTimeout(resolve, 1_150));
        for (const oscillator of state.musicOscillators) oscillator.stop();
        const stopped = new Promise((resolve) =>
          state.recorder.addEventListener("stop", resolve, { once: true })
        );
        state.recorder.stop();
        await stopped;
        const blob = new Blob(state.chunks, { type: state.recorder.mimeType });
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        await window.saveKoraDemo(dataUrl);
        return { bytes: blob.size, mimeType: blob.type };
      }
    };
  </script>
</body>
</html>
