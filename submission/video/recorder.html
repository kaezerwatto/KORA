<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>KORA — Enregistreur de démonstration réelle</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08100c;
    }
    body { display: grid; place-items: center; }
    canvas { width: 1280px; height: 720px; }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>
  <script>
    const canvas = document.querySelector("#stage");
    const ctx = canvas.getContext("2d", { alpha: false });
    const width = canvas.width;
    const height = canvas.height;
    const logo = new Image();
    logo.src = "../../src/icons/icon-128.png";

    const state = {
      mode: "brand",
      title: "KORA",
      chapter: "La finance numérique en fulfulde",
      caption: "Comprendre, vérifier et confirmer dans sa langue",
      frame: null,
      cursor: { x: width / 2, y: height / 2, visible: false },
      click: { startedAt: 0 },
      focus: null,
      focusCurrent: null,
      transitionStartedAt: performance.now(),
      sceneIndex: 0,
      sceneCount: 7,
      audio: null,
      audioEnded: true,
      audioContext: null,
      audioDestination: null,
      musicGain: null,
      musicOscillators: [],
      musicTimer: null,
      recorder: null,
      chunks: []
    };

    function roundRect(x, y, w, h, radius) {
      const r = Math.min(radius, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrap(text, x, y, maxWidth, lineHeight, maxLines = 4) {
      const words = text.split(/\s+/u);
      let line = "";
      let row = 0;
      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (ctx.measureText(candidate).width > maxWidth && line) {
          ctx.fillText(line, x, y + row * lineHeight);
          line = word;
          row += 1;
          if (row >= maxLines - 1) break;
        } else {
          line = candidate;
        }
      }
      if (row < maxLines) ctx.fillText(line, x, y + row * lineHeight);
      return y + (row + 1) * lineHeight;
    }

    function drawBrand() {
      ctx.fillStyle = "#08100c";
      ctx.fillRect(0, 0, width, height);
      const glow = ctx.createRadialGradient(1040, 90, 20, 1040, 90, 600);
      glow.addColorStop(0, "rgba(35, 190, 151, .30)");
      glow.addColorStop(1, "rgba(8, 16, 12, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);

      ctx.globalAlpha = 0.98;
      ctx.drawImage(logo, 86, 88, 92, 92);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#edbd45";
      ctx.font = "800 16px DejaVu Sans, Arial";
      ctx.fillText("SAFINUM INNOVATE CHALLENGE 2026", 86, 248);
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 60px DejaVu Sans, Arial";
      const bottom = wrap(state.title, 86, 326, 860, 68, 3);
      ctx.fillStyle = "#9fb9af";
      ctx.font = "400 25px DejaVu Sans, Arial";
      wrap(state.caption, 88, bottom + 24, 820, 38, 3);

      roundRect(86, 572, 425, 48, 24);
      ctx.fillStyle = "#10271f";
      ctx.fill();
      ctx.fillStyle = "#55d8b5";
      ctx.font = "700 16px DejaVu Sans, Arial";
      ctx.fillText("KORA TEAM · Yaoundé, Cameroun", 111, 603);
    }

    function smoothFocus() {
      if (!state.focus) {
        state.focusCurrent = null;
        return null;
      }
      if (!state.focusCurrent) state.focusCurrent = { ...state.focus };
      for (const key of ["x", "y", "width", "height"]) {
        state.focusCurrent[key] += (state.focus[key] - state.focusCurrent[key]) * 0.09;
      }
      return state.focusCurrent;
    }

    function drawScreen() {
      ctx.fillStyle = "#09110d";
      ctx.fillRect(0, 0, width, height);
      if (state.frame) {
        const focus = smoothFocus();
        if (focus) {
          ctx.drawImage(
            state.frame,
            focus.x,
            focus.y,
            focus.width,
            focus.height,
            0,
            0,
            width,
            height
          );
        } else {
          ctx.drawImage(state.frame, 0, 0, width, height);
        }
      }

      const top = ctx.createLinearGradient(0, 0, 0, 92);
      top.addColorStop(0, "rgba(5, 12, 9, .88)");
      top.addColorStop(1, "rgba(5, 12, 9, 0)");
      ctx.fillStyle = top;
      ctx.fillRect(0, 0, width, 92);
      ctx.drawImage(logo, 28, 20, 42, 42);
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 20px DejaVu Sans, Arial";
      ctx.fillText("KORA", 83, 48);
      ctx.fillStyle = "#c3d6cf";
      ctx.textAlign = "right";
      ctx.font = "700 15px DejaVu Sans, Arial";
      ctx.fillText(state.chapter, width - 30, 47);
      ctx.textAlign = "left";

      if (state.caption) {
        roundRect(44, height - 104, width - 88, 62, 14);
        ctx.fillStyle = "rgba(7, 15, 11, .88)";
        ctx.fill();
        ctx.strokeStyle = "rgba(79, 214, 177, .45)";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "600 19px DejaVu Sans, Arial";
        ctx.textAlign = "center";
        ctx.fillText(state.caption, width / 2, height - 66);
        ctx.textAlign = "left";
      }

      if (state.cursor.visible) {
        const { x, y } = state.cursor;
        const elapsed = performance.now() - state.click.startedAt;
        if (elapsed < 560) {
          const progress = elapsed / 560;
          ctx.beginPath();
          ctx.arc(x, y, 11 + progress * 26, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(237, 189, 69, ${1 - progress})`;
          ctx.lineWidth = 4 - progress * 2;
          ctx.stroke();
        }
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 26);
        ctx.lineTo(7, 19);
        ctx.lineTo(13, 31);
        ctx.lineTo(19, 28);
        ctx.lineTo(13, 16);
        ctx.lineTo(24, 15);
        ctx.closePath();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,.7)";
        ctx.shadowBlur = 7;
        ctx.fill();
        ctx.strokeStyle = "#08100c";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawProgress() {
      const local =
        state.audio && Number.isFinite(state.audio.duration) && state.audio.duration > 0
          ? Math.min(1, state.audio.currentTime / state.audio.duration)
          : 0;
      const overall = (state.sceneIndex + local) / state.sceneCount;
      ctx.fillStyle = "rgba(12, 29, 22, .92)";
      ctx.fillRect(0, height - 5, width, 5);
      ctx.fillStyle = "#27c49c";
      ctx.fillRect(0, height - 5, width * overall, 5);
    }

    function draw() {
      if (state.mode === "screen") drawScreen();
      else drawBrand();
      drawProgress();

      const transition = performance.now() - state.transitionStartedAt;
      if (transition < 420) {
        ctx.fillStyle = `rgba(8, 16, 12, ${1 - transition / 420})`;
        ctx.fillRect(0, 0, width, height);
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    function setFrame(dataUrl) {
      const image = new Image();
      image.onload = () => {
        state.frame = image;
      };
      image.src = dataUrl;
    }

    window.koraVideo = {
      setScene({ mode, title, chapter, caption, index, count }) {
        state.mode = mode;
        state.title = title ?? state.title;
        state.chapter = chapter ?? state.chapter;
        state.caption = caption ?? "";
        state.sceneIndex = index ?? state.sceneIndex;
        state.sceneCount = count ?? state.sceneCount;
        state.transitionStartedAt = performance.now();
        if (mode !== "screen") {
          state.cursor.visible = false;
          state.focus = null;
        }
      },
      setFrame,
      setCursor(cursor) {
        state.cursor = { ...state.cursor, ...cursor };
      },
      click() {
        state.click.startedAt = performance.now();
      },
      setFocus(focus) {
        state.focus = focus;
        if (!focus) state.focusCurrent = null;
      },
      async startRecording() {
        state.audioContext = new AudioContext();
        state.audioDestination = state.audioContext.createMediaStreamDestination();
        await state.audioContext.resume();

        const filter = state.audioContext.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 820;
        filter.Q.value = 0.7;
        state.musicGain = state.audioContext.createGain();
        state.musicGain.gain.setValueAtTime(0, state.audioContext.currentTime);
        state.musicGain.gain.linearRampToValueAtTime(
          0.022,
          state.audioContext.currentTime + 2.4
        );
        filter.connect(state.musicGain);
        state.musicGain.connect(state.audioDestination);

        const chords = [
          [110, 164.81, 220],
          [98, 146.83, 196],
          [130.81, 196, 261.63],
          [87.31, 130.81, 174.61]
        ];
        state.musicOscillators = chords[0].map((frequency, index) => {
          const oscillator = state.audioContext.createOscillator();
          const voiceGain = state.audioContext.createGain();
          oscillator.type = index === 0 ? "sine" : "triangle";
          oscillator.frequency.value = frequency;
          oscillator.detune.value = index === 1 ? -5 : index === 2 ? 4 : 0;
          voiceGain.gain.value = index === 0 ? 0.5 : 0.22;
          oscillator.connect(voiceGain);
          voiceGain.connect(filter);
          oscillator.start();
          return oscillator;
        });
        let chordIndex = 0;
        state.musicTimer = setInterval(() => {
          chordIndex = (chordIndex + 1) % chords.length;
          const now = state.audioContext.currentTime;
          state.musicOscillators.forEach((oscillator, index) => {
            oscillator.frequency.setTargetAtTime(
              chords[chordIndex][index],
              now,
              1.4
            );
          });
        }, 8_000);

        const canvasStream = canvas.captureStream(15);
        const stream = new MediaStream([
          canvasStream.getVideoTracks()[0],
          state.audioDestination.stream.getAudioTracks()[0]
        ]);
        const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
          ? "video/webm;codecs=vp9,opus"
          : "video/webm;codecs=vp8,opus";
        state.chunks = [];
        state.recorder = new MediaRecorder(stream, {
          mimeType,
          videoBitsPerSecond: 430000,
          audioBitsPerSecond: 64000
        });
        state.recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size) state.chunks.push(event.data);
        });
        state.recorder.start(1000);
        return mimeType;
      },
      async startAudio(url, playbackRate = 1) {
        const audio = new Audio(url);
        audio.preload = "auto";
        await new Promise((resolve, reject) => {
          audio.addEventListener("loadedmetadata", resolve, { once: true });
          audio.addEventListener("error", reject, { once: true });
          audio.load();
        });
        const source = state.audioContext.createMediaElementSource(audio);
        source.connect(state.audioDestination);
        audio.playbackRate = playbackRate;
        state.audio = audio;
        state.audioEnded = false;
        audio.addEventListener("ended", () => {
          state.audioEnded = true;
        }, { once: true });
        await audio.play();
        return audio.duration;
      },
      audioStatus() {
        return {
          ended: state.audioEnded,
          currentTime: state.audio?.currentTime ?? 0,
          duration: state.audio?.duration ?? 0
        };
      },
      async stopRecording() {
        clearInterval(state.musicTimer);
        const fadeStarted = state.audioContext.currentTime;
        state.musicGain.gain.cancelScheduledValues(fadeStarted);
        state.musicGain.gain.setValueAtTime(state.musicGain.gain.value, fadeStarted);
        state.musicGain.gain.linearRampToValueAtTime(0, fadeStarted + 1.1);
        await new Promise((resolve) => setTimeout(resolve, 1_150));
        for (const oscillator of state.musicOscillators) oscillator.stop();
        const stopped = new Promise((resolve) =>
          state.recorder.addEventListener("stop", resolve, { once: true })
        );
        state.recorder.stop();
        await stopped;
        const blob = new Blob(state.chunks, { type: state.recorder.mimeType });
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        await window.saveKoraDemo(dataUrl);
        return { bytes: blob.size, mimeType: blob.type };
      }
    };
  </script>
</body>
</html>
