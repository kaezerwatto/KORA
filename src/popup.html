<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>KORA — Traduction privée</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon-48.png" width="40" height="40" alt="">
          <div>
            <h1>KORA</h1>
            <p>Traduction privée et locale</p>
          </div>
        </div>
      </header>

      <section class="language-panel">
        <div class="language-heading">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 5 8 0M8 3v2M6 5c0 4 3 7 7 8M11 5c0 3-3 6-7 8M14 19l3-8 3 8M15 16h4"/></svg>
          <div>
            <span>Langue d’affichage</span>
            <strong>Choisir la langue de la page</strong>
          </div>
        </div>
        <fieldset>
          <legend>Langue de la page</legend>
          <div class="segments">
            <label><input type="radio" name="display-language" value="fub" checked><span>Fulfulde</span></label>
            <label><input type="radio" name="display-language" value="fr"><span>Français</span></label>
            <label><input type="radio" name="display-language" value="en"><span>English</span></label>
          </div>
        </fieldset>
      </section>

      <section class="activation" aria-live="polite">
        <div class="activation-copy">
          <span class="status-icon" id="status-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7zM15 3v5h4M10 13h6M10 17h4"/></svg>
          </span>
          <div>
            <h2 id="status-title">Traduction de la page</h2>
            <p id="status-detail">Connexion à l’onglet actif…</p>
          </div>
        </div>
        <label class="switch" aria-label="Activer ou désactiver la traduction">
          <input id="enabled" type="checkbox" role="switch">
          <span aria-hidden="true"></span>
        </label>
      </section>

      <footer>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        <p>KORA traduit sur cet appareil. Vos données et valeurs sensibles ne quittent jamais la page.</p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
