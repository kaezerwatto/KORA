<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>KORA — Traduction privée</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon-48.png" width="40" height="40" alt="">
          <div>
            <h1>KORA</h1>
            <p>Traduction privée et locale</p>
          </div>
        </div>
      </header>

      <section class="language-flow" aria-label="Direction de traduction">
        <div>
          <span>Source</span>
          <strong>Langue détectée</strong>
        </div>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"/></svg>
        <div>
          <span>Destination</span>
          <strong>Fulfulde <small>fub</small></strong>
        </div>
      </section>

      <section class="activation" aria-live="polite">
        <div class="activation-copy">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <div>
            <h2 id="status-title">Traduction de la page</h2>
            <p id="status-detail">Connexion à l’onglet actif…</p>
          </div>
        </div>
        <label class="switch" aria-label="Activer ou désactiver la traduction">
          <input id="enabled" type="checkbox" role="switch">
          <span aria-hidden="true"></span>
        </label>
      </section>

      <footer>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        <p>Noms, montants et références restent intacts. Aucune donnée n’est envoyée.</p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
